spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///pricewatch_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 3025

elering:
  api:
    base-url: http://localhost:${wiremock.server.port:8089}
    timeout-seconds: 5
    retry-max-attempts: 1
    retry-backoff-ms: 100

notifications:
  email:
    enabled: false
    from: test@test.local
  webhook:
    enabled: false
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  telegram:
    enabled: false
    bot-token: ''
    api-url: http://localhost:${wiremock.server.port:8089}

scheduling:
  price-fetch-cron: "0 0 4 1 1 *"   # never fires automatically in tests
  zones: EE,FI
