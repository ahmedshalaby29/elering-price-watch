spring:
  application:
    name: elering-price-watch

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pricewatch}
    username: ${SPRING_DATASOURCE_USERNAME:pricewatch}
    password: ${SPRING_DATASOURCE_PASSWORD:pricewatch}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    # Set to true to enable email notifications; requires MAIL_* env vars
    test-connection: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Elering Price Watch
    description: Tracks Estonian Nord Pool day-ahead electricity prices
    version: '@project.version@'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# ─── Application-specific configuration ───────────────────────────────────────
elering:
  api:
    base-url: ${ELERING_API_BASE_URL:https://dashboard.elering.ee/api}
    timeout-seconds: ${ELERING_TIMEOUT_SECONDS:10}
    retry-max-attempts: ${ELERING_RETRY_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${ELERING_RETRY_BACKOFF_MS:1000}

notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@elering-price-watch.local}
  webhook:
    enabled: ${NOTIFICATIONS_WEBHOOK_ENABLED:true}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  telegram:
    enabled: ${NOTIFICATIONS_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-url: https://api.telegram.org

scheduling:
  # 14:00 CET = 11:00 UTC  (CET is UTC+1 in winter, CEST is UTC+2 in summer)
  # Elering typically publishes next-day prices ~13:00-14:00 CET
  price-fetch-cron: ${PRICE_FETCH_CRON:0 0 11 * * *}
  # Fetch all four Baltic zones on schedule
  zones: EE,FI,LV,LT
